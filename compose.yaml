services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: omk-mosquitto
    restart: unless-stopped
    ports:
      - "192.168.50.1:1883:1883"
    volumes:
      - ./services/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./services/mosquitto/data:/mosquitto/data

  gateway:
    build:
      context: ./services/gateway
    container_name: omk-gateway
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    container_name: omk-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Tokyo
      OMK_PROCESSED_DATA_ROOT: /app/data/processed
      OMK_LATEST_DATA_ROOT: /app/data/latest
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/latest:/app/data/latest:ro

  sensor-collector:
    build:
      context: ./services/sensor-collector
    container_name: omk-sensor-collector
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "omk/#"
      DATA_ROOT: /app/data/sensors
      LATEST_DATA_ROOT: /app/data/latest
      TZ: Asia/Tokyo
    volumes:
      - ./data/sensors:/app/data/sensors
      - ./data/latest:/app/data/latest

  broute-meter-mock:
    build:
      context: ./broute-meter
      target: runtime
    command:
      - --settings
      - config/settings.example.yaml
      - setup-adapter
      - --mock
    environment:
      OMK_DATA_DIR: /data
      OMK_LOG_DIR: /logs
    volumes:
      - ./data/broute-meter:/data
      - ./logs/broute-meter:/logs
    user: "${OMK_UID:-1000}:${OMK_GID:-1000}"
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  broute-meter-tests:
    profiles:
      - test
    build:
      context: ./broute-meter
      target: test
    command:
      - tests/integration
      - -q
      - -p
      - no:cacheprovider
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
