services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: omk-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./services/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./services/mosquitto/data:/mosquitto/data

  dashboard:
    build:
      context: ./services/dashboard
    container_name: omk-dashboard
    restart: unless-stopped
    ports:
      # Admin pages can reveal the AP PSK. Docker only publishes loopback;
      # systemd socket proxies provide explicitly device-bound OMK AP access.
      - "127.0.0.1:8000:8000"
    environment:
      TZ: Asia/Tokyo
      OMK_PROCESSED_DATA_ROOT: /app/data/processed
      OMK_LATEST_DATA_ROOT: /app/data/latest
      OMK_DASHBOARD_SETTINGS_PATH: /app/data/dashboard/settings.json
      OMK_BLE_MANAGER_URL: http://host.docker.internal:8787
      OMK_SYSTEM_MANAGER_URL: http://host.docker.internal:8788
    env_file:
      - /etc/omk/dashboard-system-manager.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/latest:/app/data/latest:ro
      - ./data/dashboard:/app/data/dashboard

  sensor-collector:
    build:
      context: ./services/sensor-collector
    container_name: omk-sensor-collector
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "omk/#"
      DATA_ROOT: /app/data/sensors
      LATEST_DATA_ROOT: /app/data/latest
      TZ: Asia/Tokyo
    volumes:
      - ./data/sensors:/app/data/sensors
      - ./data/latest:/app/data/latest

  harvest-uploader:
    build:
      context: ./services/harvest-uploader
    container_name: omk-harvest-uploader
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: omk-harvest-uploader
      MQTT_TOPIC: omk/#
      HARVEST_ENDPOINT: ${HARVEST_ENDPOINT:-http://harvest.soracom.io}
      HARVEST_TIMEOUT_SECONDS: ${HARVEST_TIMEOUT_SECONDS:-10}
      HARVEST_RETRY_MAX_AGE_SECONDS: ${HARVEST_RETRY_MAX_AGE_SECONDS:-3600}
      HARVEST_QUEUE_PATH: /app/data/harvest-uploader/queue.sqlite3
      TZ: Asia/Tokyo
    volumes:
      - ./data/harvest-uploader:/app/data/harvest-uploader
