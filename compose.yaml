services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: omk-mosquitto
    restart: unless-stopped
    ports:
      - "192.168.50.1:1883:1883"
    volumes:
      - ./services/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./services/mosquitto/data:/mosquitto/data

  gateway:
    build:
      context: ./services/gateway
    container_name: omk-gateway
    restart: unless-stopped

  broute-meter-mock:
    build:
      context: ./broute-meter
      target: runtime
    command:
      - --settings
      - config/settings.example.yaml
      - setup-adapter
      - --mock
    environment:
      OMK_DATA_DIR: /data
      OMK_LOG_DIR: /logs
    volumes:
      - ./data/broute-meter:/data
      - ./logs/broute-meter:/logs
    user: "${OMK_UID:-1000}:${OMK_GID:-1000}"
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  broute-meter-tests:
    profiles:
      - test
    build:
      context: ./broute-meter
      target: test
    command:
      - tests/integration
      - -q
      - -p
      - no:cacheprovider
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
