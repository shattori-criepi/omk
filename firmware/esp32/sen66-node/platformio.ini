[platformio]
default_envs = m5stack-atoms3

; M5Stack AtomS3 Lite (ESP32-S3FN8).  The espressif32 6.9.0 platform ships
; the m5stack-atoms3 board definition, which specifies the compatible 8 MB
; ESP32-S3 target.  Serial uses the AtomS3 Lite USB-C port via USB CDC.
; Verified Grove-to-STEMMA QT wiring: GPIO2 is SDA and GPIO1 is SCL.
[env:m5stack-atoms3]
platform = espressif32@6.9.0
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200

lib_deps =
    Sensirion/Sensirion I2C SEN66@1.3.1
    Sensirion/Sensirion Core@0.7.3
    knolleary/PubSubClient@2.8

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OMK_I2C_SDA_PIN=2
    -D OMK_I2C_SCL_PIN=1

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    Sensirion/Sensirion I2C SEN66@1.3.1
    Sensirion/Sensirion Core@0.7.3
    knolleary/PubSubClient@2.8

build_flags =
    -Wall
    -Wextra
    -std=gnu++17

; Custom OMK ESP32-C3-MINI-1-H4X board.  Keep esp32dev above for the
; existing Freenove/DevKitC setup; this environment is the Rev.A target.
[env:omk-esp32-c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

lib_deps =
    Sensirion/Sensirion I2C SEN66@1.3.1
    Sensirion/Sensirion Core@0.7.3
    knolleary/PubSubClient@2.8

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OMK_I2C_SDA_PIN=6
    -D OMK_I2C_SCL_PIN=7
