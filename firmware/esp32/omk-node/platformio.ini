[platformio]
default_envs = atom-s3-lite

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -D OMK_NODE_CAPABILITIES=1

; AtomS3 Lite uses the AtomS3-compatible board definition. No display, LED,
; or button code is part of the provisioning beacon.
[env:atom-s3-lite]
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

; M5StickC (original ESP32) board ID is supplied by espressif32. M5StickC Plus
; and Plus2 are different products and intentionally require a separate,
; verified environment before adding one here.
[env:m5stick-c]
board = m5stick-c
