[platformio]
default_envs = atom-s3-lite
[env]
platform = espressif32@7.0.1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
[env:atom-s3-lite]
board = m5stack-atoms3
; Temporary provisioning diagnostics: target sdkconfig selects USB Serial/JTAG
; as the primary console so early boot logs are available on /dev/ttyACM*.
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.atom-s3-lite
[env:m5stick-c]
board = m5stick-c
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.m5stick-c

; Development-only, one-shot images.  They are never the default firmware and
; are flashed only by scripts/reset-omk-node-registration.sh with --confirm.
[env:atom-s3-lite-registration-reset]
extends = env:atom-s3-lite
build_flags = -DOMK_DEVELOPMENT_CLEAR_REGISTRATION=1

[env:m5stick-c-registration-reset]
extends = env:m5stick-c
build_flags = -DOMK_DEVELOPMENT_CLEAR_REGISTRATION=1

; Development-only, one-shot images generated by set-omk-node-wifi.sh. The
; script creates a 0600 ignored header just for this build, then restores the
; normal firmware and removes the secret-bearing build directory.
[env:atom-s3-lite-wifi-set]
extends = env:atom-s3-lite
build_flags = -DOMK_DEVELOPMENT_SET_WIFI_CREDENTIALS=1

[env:m5stick-c-wifi-set]
extends = env:m5stick-c
build_flags = -DOMK_DEVELOPMENT_SET_WIFI_CREDENTIALS=1
