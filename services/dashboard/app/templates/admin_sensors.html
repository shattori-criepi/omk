<!doctype html>
<html lang="ja" class="admin-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OMK 機器管理</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/display.css') }}?v=20261006-atom-confirmation-1">
    <script src="{{ url_for('static', path='/software_keyboard.js') }}?v=20260918-sensor-keyboard-1" defer></script>
    <script src="{{ url_for('static', path='/admin.js') }}?v=20261006-atom-confirmation-1" defer></script>
  </head>
  <body class="admin-body">
    <main class="admin-page sensor-management-page" aria-label="OMK 機器管理">
      <header class="admin-page-header">
        <a href="/admin" class="back-link">‹ 管理メニューへ戻る</a>
        <h1>機器管理</h1>
      </header>
      <section class="sensor-toolbar" aria-label="BLE センサ探索">
        <p id="setup-status" class="setup-status">登録済みセンサを表示しています。</p>
        <div class="admin-actions">
          <button id="start-scan" class="primary">センサを追加</button>
          <button id="stop-scan" hidden>探索を中止</button>
        </div>
      </section>
      <section class="sensor-content" aria-label="機器一覧">
        <div id="omk-nodes" class="sensor-list"></div>
        <div id="candidates" class="sensor-list" hidden></div>
        <div id="registered-sensors" class="sensor-list"></div>
      </section>
    </main>
    <section id="logical-id-keyboard-overlay" class="broute-keyboard-overlay logical-id-keyboard-overlay" role="dialog" aria-modal="true" aria-labelledby="logical-id-keyboard-title" hidden>
      <header class="broute-keyboard-header">
        <h2 id="logical-id-keyboard-title">Logical ID</h2>
        <p id="logical-id-keyboard-count" class="broute-keyboard-count">0 / 48文字</p>
        <p id="logical-id-keyboard-value" class="broute-keyboard-value" aria-live="polite"></p>
      </header>
      <div id="logical-id-keyboard-keys" class="broute-keyboard-keys" aria-label="Logical IDキーボード"></div>
      <footer class="broute-keyboard-actions">
        <button id="logical-id-keyboard-cancel" type="button">キャンセル</button>
        <button id="logical-id-keyboard-confirm" class="primary" type="button">登録する</button>
      </footer>
    </section>
    <dialog id="register-dialog" class="register-dialog" aria-labelledby="register-title">
      <form id="register-form" method="dialog">
        <h2 id="register-title">センサを登録</h2>
        <p id="register-device" class="dialog-device"></p>
        <div id="unconfirmed-model-confirmation" hidden>
          <p>この機器は自動判定できません。機器を操作した際の受信変化などで対象を確認してください。</p>
          <label><input id="confirm-unconfirmed-model" type="checkbox">対象の実物が<span id="confirmed-model-name"></span>であることを確認しました</label>
        </div>
        <label>OMK センサID<input id="sensor-id" name="sensor_id" required pattern="[a-z][a-z0-9-]{0,63}" placeholder="co2-001" autocomplete="off"></label>
        <p class="field-hint">種別＋連番を自動提案します（例: <code>co2-001</code>、<code>th-001</code>）。</p>
        <label>表示名<input id="display-name" name="display_name" required maxlength="64" placeholder="リビング" autocomplete="off"></label>
        <label>設置場所（任意）<input id="location" name="location" maxlength="64" placeholder="living-room" autocomplete="off"></label>
        <p id="register-error" class="error" hidden></p>
        <div class="dialog-actions"><button type="button" id="cancel-register">キャンセル</button><button type="submit" class="primary">登録する</button></div>
      </form>
    </dialog>
    <dialog id="edit-dialog" class="register-dialog" aria-labelledby="edit-title">
      <form id="edit-form" method="dialog">
        <h2 id="edit-title">センサを編集</h2>
        <p id="edit-physical-info" class="dialog-device"></p>
        <label>OMK センサID<input id="edit-sensor-id" name="sensor_id" required pattern="[a-z][a-z0-9-]{0,63}" autocomplete="off"></label>
        <label>表示名<input id="edit-display-name" name="display_name" required maxlength="64" autocomplete="off"></label>
        <label>設置場所（任意）<input id="edit-location" name="location" maxlength="64" autocomplete="off"></label>
        <label class="enabled-control"><input id="edit-enabled" name="enabled" type="checkbox"> このセンサを有効にする</label>
        <p id="edit-error" class="error" hidden></p>
        <div class="dialog-actions"><button type="button" id="cancel-edit">キャンセル</button><button type="submit" class="primary">保存する</button></div>
        <button type="button" id="delete-sensor" class="danger">センサ登録を削除</button>
      </form>
    </dialog>
    <section id="sensor-keyboard-overlay" class="broute-keyboard-overlay logical-id-keyboard-overlay" aria-labelledby="sensor-keyboard-title" hidden>
      <header class="broute-keyboard-header">
        <h2 id="sensor-keyboard-title">テキスト入力</h2>
        <p id="sensor-keyboard-count" class="broute-keyboard-count"></p>
        <input id="sensor-keyboard-value" class="broute-keyboard-value" type="text" aria-labelledby="sensor-keyboard-title" autocomplete="off" maxlength="64">
      </header>
      <div id="sensor-keyboard-keys" class="broute-keyboard-keys"></div>
      <footer class="broute-keyboard-actions">
        <button id="sensor-keyboard-cancel" type="button">キャンセル</button>
        <button id="sensor-keyboard-confirm" type="button" class="primary">入力を反映</button>
      </footer>
    </section>
  </body>
</html>
