<!doctype html>
<html lang="ja" class="admin-document"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>OMK 表示設定</title><link rel="stylesheet" href="{{ url_for('static', path='/display.css') }}?v=20260819-clock-navigation-2"><script src="{{ url_for('static', path='/admin_display.js') }}?v=20260819-clock-navigation-2" defer></script><script src="{{ url_for('static', path='/demo_settings.js') }}?v=20260903-demo-1" defer></script></head>
<body class="admin-body"><main class="admin-page display-settings-page" aria-label="表示設定"><header class="admin-page-header"><a href="/admin" class="back-link">← 管理メニュー</a><h1>表示設定</h1></header>
<section class="display-settings-intro"><div><h2>表示モード</h2><div id="display-modes" class="display-mode-selector" role="group" aria-label="表示モード"><button type="button" data-mode="recommended">おすすめ</button><button type="button" data-mode="custom">カスタム</button><button type="button" data-mode="clock">時計</button></div></div><p id="capacity-status" class="setup-status"></p></section>
<section id="recommended-summary" class="display-settings-content" hidden></section><section id="clock-summary" class="display-settings-content" hidden><h2>時計</h2><p>日付と時刻を大きく表示し、主要な環境情報を補助表示します。</p></section>
<section class="display-settings-intro"><h2>展示用デモモード</h2><p>未接続・古い値だけを表示用fixtureで補い、カスタム・時計・おすすめを10秒ごとに切り替えます。</p><label><input id="demo-enabled" type="checkbox"> 展示用デモモードを有効にする</label></section>
<section id="custom-editor"><section class="display-settings-intro"><div><h2>カスタム</h2><p>sourceごとにブロックを作り、ブロック内の値と主表示を選びます。</p></div></section><section id="selected-items" class="display-settings-content" aria-label="表示中ブロック"></section><section id="available-items" class="display-settings-content" aria-label="表示可能なデータ"></section></section>
<div class="display-settings-actions"><p id="settings-status" class="setup-status"></p><button id="refresh-recommended" type="button">おすすめを更新</button><button id="save-settings" class="primary">保存してダッシュボードを確認</button></div></main></body></html>
