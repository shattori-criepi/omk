<!doctype html>
<html lang="ja" class="admin-document"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>OMK 表示設定</title><link rel="stylesheet" href="{{ url_for('static', path='/display.css') }}?v=20260916-demo-mode-2"><script src="{{ url_for('static', path='/admin_display.js') }}?v=20260916-demo-mode-1" defer></script></head>
<body class="admin-body"><main class="admin-page display-settings-page" aria-label="表示設定"><header class="admin-page-header"><a href="/admin" class="back-link">‹ 管理メニューへ戻る</a><h1>表示設定</h1></header>
<section class="display-settings-main" aria-label="通常の表示設定">
<section class="display-settings-intro"><div><h2>表示モード</h2><div id="display-modes" class="display-mode-selector" role="group" aria-label="表示モード"><div class="regular-mode-buttons"><button type="button" data-mode="recommended">おすすめ</button><button type="button" data-mode="custom">カスタム</button><button type="button" data-mode="clock">時計</button></div><div class="demo-mode-option"><button type="button" data-mode="demo" class="demo-mode" aria-label="デモ（展示・動作確認用）">デモ</button><small>展示・動作確認用。模擬データを含む表示を確認できます。</small></div></div></div><p id="capacity-status" class="setup-status"></p></section>
<section id="recommended-summary" class="display-settings-content" hidden></section><section id="clock-summary" class="display-settings-content" hidden><h2>時計</h2><p>日付と時刻を大きく表示し、現在利用できる電力・環境情報を自動で補助表示します。</p></section>
<section id="custom-editor" hidden><section class="display-settings-intro"><div><h2>カスタム</h2><p>sourceごとにブロックを作り、ブロック内の値と主表示を選びます。</p></div></section><section id="selected-items" class="display-settings-content" aria-label="表示中ブロック"></section><section id="available-items" class="display-settings-content" aria-label="表示可能なデータ"></section></section>
<div class="display-settings-actions"><p id="settings-status" class="setup-status"></p><button id="save-settings" class="primary">保存してダッシュボードを確認</button></div>
</section>
</main></body></html>
