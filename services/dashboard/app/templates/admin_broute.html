<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OMK Bルート設定</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/display.css') }}?v=20260814-broute">
    <script src="{{ url_for('static', path='/broute.js') }}?v=20260814-broute" defer></script>
  </head>
  <body>
    <main class="admin-page broute-management-page" aria-label="OMK Bルート設定">
      <header class="admin-page-header">
        <a href="/admin" class="back-link">← 管理</a>
        <h1>Bルート設定</h1>
      </header>
      <section class="broute-panel" aria-labelledby="broute-connection-title">
        <h2 id="broute-connection-title">接続状態</h2>
        <p id="broute-connection" class="broute-connection">確認中</p>
        <dl class="broute-status-list">
          <div><dt>現在のID</dt><dd id="broute-id-masked">確認中</dd></div>
          <div><dt>パスワード</dt><dd id="broute-password-configured">確認中</dd></div>
        </dl>
      </section>
      <form id="broute-form" class="broute-form" autocomplete="off">
        <label>BルートID
          <input id="broute-id" name="id" required minlength="32" maxlength="32" pattern="[!-~]{32}" autocomplete="off" spellcheck="false" aria-describedby="broute-id-hint">
        </label>
        <p id="broute-id-hint" class="field-hint">空白を含まないASCII 32文字</p>
        <label>パスワード
          <input id="broute-password" name="password" type="password" required minlength="12" maxlength="12" pattern="[!-~]{12}" autocomplete="new-password" spellcheck="false" aria-describedby="broute-password-hint">
        </label>
        <p id="broute-password-hint" class="field-hint">空白を含まないASCII 12文字</p>
        <p id="broute-message" class="setup-status" role="status" aria-live="polite">保存済みのIDとパスワードは表示しません。</p>
        <button id="broute-save" class="primary" type="submit">保存して接続</button>
      </form>
    </main>
  </body>
</html>
