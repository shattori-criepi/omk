measurement:
  instantaneous_interval_seconds: 10
  # EA/EBは起動時と、毎時00分・30分の後にだけ取得する。
  cumulative_fetch_delay_seconds: 5

serial:
  port: null
  baudrate: 115200
  timeout_seconds: 5

adapter:
  auto_configure: true
  expected_settings:
    uart_mode: "80"
    output_mode: "01"

retry:
  request_timeout_seconds: 5
  request_max_attempts: 3
  reconnect_after_consecutive_failures: 5
  # 起動時スキャンやPANA接続に失敗した場合も、この秒数後に接続全体を再試行する。
  reconnect_wait_seconds: 30

storage:
  # services/broute-meterディレクトリから見たOMK共通の実行時データ領域。
  # DockerではOMK_DATA_DIR=/dataで上書きする。
  data_directory: "../../data/broute-meter"

logging:
  # 通常運用はINFO。起動・保存・再接続・警告・エラーを記録する。
  # 障害調査時だけDEBUGへ変更すると、送受信、TID、EPC、再試行の詳細を記録する。
  # WARNING、ERROR、CRITICALも指定できるが、通常の継続計測にはINFOを推奨する。
  level: "INFO"
  # DockerではOMK_LOG_DIR=/logsで上書きする。
  directory: "../../logs/broute-meter"

mqtt:
  enabled: false
  host: "192.168.50.1"
  port: 1883
  device_id: "broute-001"
  topic_prefix: "omk"
  client_id: "omk-broute-001"
