measurement:
  instantaneous_interval_seconds: 10
  # EA/EBは起動時と、毎時00分・30分の後にだけ取得する。
  cumulative_fetch_delay_seconds: 5

serial:
  port: null
  baudrate: 115200
  timeout_seconds: 5

adapter:
  auto_configure: true
  expected_settings:
    uart_mode: "80"
    output_mode: "01"

retry:
  request_timeout_seconds: 5
  request_max_attempts: 3
  reconnect_after_consecutive_failures: 5
  reconnect_wait_seconds: 30

storage:
  # broute-meterディレクトリから見たOMK共通の実行時データ領域。
  # DockerではOMK_DATA_DIR=/dataで上書きする。
  data_directory: "../data/broute-meter"

logging:
  level: "INFO"
  # DockerではOMK_LOG_DIR=/logsで上書きする。
  directory: "../logs/broute-meter"
