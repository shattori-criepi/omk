services:
  broute-meter-mock:
    build:
      context: .
      target: runtime
    command:
      - --settings
      - config/settings.example.yaml
      - setup-adapter
      - --mock
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /app/logs:mode=0750,uid=10001,gid=10001
      - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tests:
    profiles:
      - test
    build:
      context: .
      target: test
    command:
      - tests/integration
      - -q
      - -p
      - no:cacheprovider
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
